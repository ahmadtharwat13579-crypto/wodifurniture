<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">WODI Furniture | تفاصيل المنتج</title>
  <link rel="icon" type="image/png" href="images/logos/favicon-v1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/footer.css">
  <!-- استدعاء مكتبة Google Model Viewer لعرض الـ 3D مجاناً -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

<nav class="navbar-2" id="navbar">
  <div class="nav-right">
    <a href="index.html">الرئيسية</a>
    <a href="products.html" class="active">منتجاتنا</a>
    <a href="configurator.html">وحدات الحوض</a>
  </div>
  <div class="nav-left">
    <a href="index.html" class="logo-link">
      <img id="navLogo" src="images/logos/logo-white.png" alt="WODI" class="nav-logo" />
    </a>
  </div>
</nav>

<main class="conf-page" style="padding: 40px 20px;">
  <div class="conf" style="max-width: 900px; margin: 0 auto; background: #faf9f6; border: 1px solid #e7e3da; border-radius: 2px; padding: 30px;">
    
    <div id="product-details-container">
      <!-- سيتم تحميل بيانات المنتج وتفاصيله وصوره هنا ديناميكياً -->
      <p style="text-align: center; color: rgba(51,48,40,0.6); padding: 40px;">جاري تحميل تفاصيل المنتج...</p>
    </div>

  </div>
</main>

<!-- Lightbox -->
<div class="lb" id="prod-lb" onclick="closeLB()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center;">
  <button class="lb-close" onclick="closeLB()" style="position:absolute; top:20px; right:20px; background:none; border:none; color:#fff; font-size:30px; cursor:pointer;">×</button>
  <img id="prod-lb-img" src="" alt="" style="max-width:90%; max-height:90%; border-radius:2px;" />
</div>

<footer class="wodi-footer">
  <div class="footer-top-section">
    <img src="images/logos/logo-nobg.png" alt="WODI Furniture Logo" class="footer-logo">
  </div>
  <div class="footer-container">
    <div class="footer-col">
      <h4>المنتجات</h4>
      <ul class="footer-links">
        <li><a href="products.html">وحدات الغسالة</a></li>
        <li><a href="products.html">جميع المنتجات</a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4>تواصل معنا</h4>
      <div class="social-icons-wrapper">
        <a href="https://wa.me/201556840368" aria-label="WhatsApp">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
        </a>
      </div>
    </div>
  </div>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz3xuCuZ6sU9QVo2nTRaItWFLplEhG7bKuzeZSQpk4DseShYrzycpRhyO2u2kuwPVkY/exec?pwd=double-protection-password";
const WA = '201556840368';
const GH = 'https://raw.githubusercontent.com/ahmadtharwat13579-crypto/wodifurniture/main/website/images/';

function openLB(src) {
  document.getElementById('prod-lb-img').src = src;
  document.getElementById('prod-lb').style.display = 'flex';
}
function closeLB() {
  document.getElementById('prod-lb').style.display = 'none';
}

function contactWA(name, price) {
  const msg = 'السلام عليكم، أرغب في الاستفسار عن:\n' + name + '\nالسعر: ' + price + ' EGP';
  window.open('https://wa.me/' + WA + '?text=' + encodeURIComponent(msg), '_blank');
}

async function loadProductDetail() {
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');
  const container = document.getElementById('product-details-container');

  if (!productId) {
    container.innerHTML = '<p style="text-align:center; color:#d9534f;">لم يتم تحديد المنتج المطلوبة.</p>';
    return;
  }

  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    const product = data.products.find(p => p.product_id === productId);

    if (!product) {
      container.innerHTML = '<p style="text-align:center; color:#d9534f;">المنتج غير موجود.</p>';
      return;
    }

    document.getElementById('page-title').textContent = `WODI Furniture | ${product.display_name}`;

    const basePrice = Math.round(product.base_price || 0);
    const salePrice = product.sale_price && product.sale_price !== '' ? Math.round(product.sale_price) : null;
    const priceText = `${salePrice || basePrice} EGP`;

    // الـ 3 صور الثابتة للمنتج (_1, _2, _3)
    const img1 = GH + product.product_id + '_1.webp';
    const img2 = GH + product.product_id + '_2.webp';
    const img3 = GH + product.product_id + '_3.webp';

    // مسار الـ 3D Model إن وجد في عمود model_url بالجدول
    const modelUrl = product.model_url && product.model_url !== '' ? product.model_url : null;

    container.innerHTML = `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start;" class="prod-detail-grid">
        
        <!-- قسم الصور والـ 3D -->
        <div>
          <div style="position: relative; width: 100%; height: 380px; background: #fff; border: 1px solid #e7e3da; border-radius: 2px; overflow: hidden; margin-bottom: 12px;">
            <img id="main-product-img" src="${img1}" alt="${product.display_name}" style="width: 100%; height: 100%; object-fit: cover;">
            
            <button class="zoom-btn" onclick="openLB(document.getElementById('main-product-img').src)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            </button>

            ${modelUrl ? `
              <button id="view-3d-btn" onclick="toggle3D(true)" style="position: absolute; bottom: 12px; left: 12px; background: #333028; color: #fff; border: none; padding: 8px 14px; border-radius: 2px; font-family:'Cairo',sans-serif; font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                View in 3D
              </button>
            ` : ''}
          </div>

          ${modelUrl ? `
            <model-viewer id="product-model-viewer" src="${modelUrl}" alt="3D Model" auto-rotate camera-controls style="width: 100%; height: 380px; display: none; background: #fff; border: 1px solid #e7e3da; border-radius: 2px; margin-bottom: 12px;">
              <button slot="ar-button" style="background:#9caf88; color:white; border-radius:2px; border:none; padding:8px 12px;">عرض في غرفتك (AR)</button>
              <button onclick="toggle3D(false)" style="position:absolute; top:12px; left:12px; background:#333028; color:#fff; border:none; padding:6px 10px; border-radius:2px; cursor:pointer;">العودة للصور</button>
            </model-viewer>
          ` : ''}

          <!-- صور مصغرة للتبديل (_1, _2, _3) -->
          <div style="display: flex; gap: 10px;">
            <img src="${img1}" onclick="switchImg('${img1}')" style="width: 70px; height: 70px; object-fit: cover; border: 1px solid #e7e3da; border-radius: 2px; cursor: pointer;">
            <img src="${img2}" onclick="switchImg('${img2}')" style="width: 70px; height: 70px; object-fit: cover; border: 1px solid #e7e3da; border-radius: 2px; cursor: pointer;" onerror="this.style.display='none'">
            <img src="${img3}" onclick="switchImg('${img3}')" style="width: 70px; height: 70px; object-fit: cover; border: 1px solid #e7e3da; border-radius: 2px; cursor: pointer;" onerror="this.style.display='none'">
          </div>
        </div>

        <!-- قسم معلومات المنتج -->
        <div style="display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <h1 style="font-size: 24px; font-weight: 700; color: #333028; margin-bottom: 12px;">${product.display_name}</h1>
            
            <div style="font-size: 22px; font-weight: 700; color: #333028; margin-bottom: 16px;">
              ${salePrice ? `<span style="text-decoration: line-through; color: rgba(51,48,40,0.5); font-size: 16px; margin-left: 10px;">${basePrice} EGP</span>` : ''}
              <span>${salePrice || basePrice} EGP</span>
            </div>

            <p style="font-size: 14px; color: rgba(51,48,40,0.8); line-height: 1.7; margin-bottom: 20px;">${product.description || ''}</p>

            ${product.width && product.height && product.depth ? `
              <div style="background: #fff; border: 1px solid #e7e3da; padding: 12px; border-radius: 2px; margin-bottom: 20px; font-size: 13px; color: #333028;">
                <strong>المقاسات:</strong> العرض ${product.width} سم × العمق ${product.depth} سم × الارتفاع ${product.height} سم
              </div>
            ` : ''}
          </div>

          <!-- زر الواتساب بدلاً من سلة المشتريات -->
          <div>
            <button class="btn-order" onclick="contactWA('${product.display_name}', '${salePrice || basePrice}')" style="width: 100%; border-radius: 2px; padding: 14px; font-size: 16px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
              استفسر عبر واتساب
            </button>
          </div>

        </div>

      </div>
    `;

  } catch (err) {
    console.error(err);
    container.innerHTML = '<p style="text-align:center; color:#d9534f;">حدث خطأ أثناء جلب تفاصيل المنتج.</p>';
  }
}

function switchImg(src) {
  const mainImg = document.getElementById('main-product-img');
  const viewer = document.getElementById('product-model-viewer');
  if (mainImg) mainImg.src = src;
  if (viewer) viewer.style.display = 'none';
  if (mainImg) mainImg.style.display = 'block';
}

function toggle3D(show) {
  const mainImg = document.getElementById('main-product-img');
  const viewer = document.getElementById('product-model-viewer');
  const btn3d = document.getElementById('view-3d-btn');

  if (show) {
    if (mainImg) mainImg.style.display = 'none';
    if (btn3d) btn3d.style.display = 'none';
    if (viewer) viewer.style.display = 'block';
  } else {
    if (viewer) viewer.style.display = 'none';
    if (mainImg) mainImg.style.display = 'block';
    if (btn3d) btn3d.style.display = 'flex';
  }
}

document.addEventListener('DOMContentLoaded', loadProductDetail);
</script>
</body>
</html>
