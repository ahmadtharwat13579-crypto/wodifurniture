<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect WhatsApp</title>
</head>

<body>

  <button id="connect-whatsapp">
    Connect WhatsApp
  </button>

  <script>
    window.fbAsyncInit = function () {
      FB.init({
        appId: '1608289084251626',
        cookie: true,
        xfbml: true,
        version: 'v24.0'
      });
    };

    (function (d, s, id) {
      var js;
      var fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) return;

      js = d.createElement(s);
      js.id = id;
      js.src = 'https://connect.facebook.net/en_US/sdk.js';
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));


    window.addEventListener('message', function (event) {

      if (event.origin !== 'https://www.facebook.com') return;

      try {
        const data = JSON.parse(event.data);

        if (data.type === 'WA_EMBEDDED_SIGNUP') {
          console.log('WhatsApp Embedded Signup:', data);
        }
      } catch (error) {
        console.log('Meta message:', event.data);
      }

    });


    document.getElementById('connect-whatsapp').addEventListener('click', function () {

      FB.login(function (response) {

        console.log('Facebook Login response:', response);

        if (response.authResponse) {
          console.log(
            'Authorization code:',
            response.authResponse.code
          );
        }

      }, {
        config_id: '1390408459872085',
        response_type: 'code',
        override_default_response_type: true,

        extras: {
          setup: {},
          featureType: 'whatsapp_business_app_onboarding'
        }
      });

    });
  </script>

</body>
</html>
