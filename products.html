<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WODI Furniture | منتجاتنا</title>
  <link rel="icon" type="image/png" href="images/logos/favicon-v1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/nav.css">
</head>
<body>

<div id="nav-placeholder"></div>

<script src="js/nav.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="https://www.google.com/recaptcha/enterprise.js?render=6Lde4nktAAAAAAPAlUeMAGT4Ki99VV9yNW56TuVw"></script>

<script>
fetch('nav.html')
    .then(res => res.text())
    .then(html => {
        document.getElementById('nav-placeholder').innerHTML = html;
        if (typeof initNavbar === 'function') {
            initNavbar();
        }

        // دالة آمنة تنتظر تحميل auth.js بدون أي تحذيرات مزعجة أو سباق زمني
        const waitForLogoutSystem = (retries = 20) => {
            if (typeof window.initLogoutSystem === 'function') {
                window.initLogoutSystem();
            } else if (retries > 0) {
                setTimeout(() => waitForLogoutSystem(retries - 1), 50);
            } else {
                console.warn('فشل تحميل نظام تسجيل الخروج بعد عدة محاولات.');
            }
        };
        waitForLogoutSystem();
    });
</script>

<main class="conf-page">
  <div class="conf config-layout">
    <section class="main-column full-width-column">

    <div class="search-section-wrapper">
  <div class="search-container">
    <div class="search-box" id="main-search-box">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="product-search-input" placeholder="ابحث عما ترغب فيه..." onfocus="openSearchDropdown()" oninput="handleAdvancedSearch(this.value)">
    </div>

    <!-- القائمة المنسدلة المعزولة تماماً عن باقي محتوى الصفحة -->
    <div class="search-dropdown" id="search-dropdown">
      <div class="search-results-container">
      

        <!-- النتائج -->
        <div class="search-suggestions-list" id="search-suggestions-list"></div>
        <div class="search-products-grid" id="search-products-grid"></div>

      </div>
    </div>
  </div>
</div>

<div class="search-backdrop" id="search-backdrop" onclick="closeSearchDropdown()"></div>

      <!-- شريط التصنيفات بنظام الشبكة الثابتة المتعددة الصفوف -->
      <div class="categories-grid-wrapper" data-group="cat-scroll">
        <div class="categories-grid scroll-x-styled" id="cat-scroll" role="list" aria-label="Categories">
          <!-- سيتم تعبئتها ديناميكياً من الجافاسكريبت -->
        </div>
      </div>

      <!-- عنوان القسم الكبير (يتغير ديناميكياً حسب الفئة) -->
      <header class="page-header-container">
        <h1 class="main-category-title" id="current-category-title">الكل</h1>
      </header>

      <!-- شريط التنقل Breadcrumbs تحته مباشرة -->
      <div class="breadcrumb-nav" id="breadcrumbs">
        <a href="index.html">الرئيسية</a> / 
        <a href="products.html">المنتجات</a> / 
        <span id="current-breadcrumb-cat">الكل</span>
      </div>

      <!-- قائمة المنتجات -->
      <div class="products-grid-container" id="prod-list">
        <!-- سيتم تعبئة المنتجات هنا -->
      </div>

    </section>
  </div>
</main>

<!-- Lightbox -->
<div class="lb product-lightbox-overlay" id="prod-lb" onclick="closeLB()">
  <button class="lb-close product-lightbox-close" onclick="closeLB()">×</button>
  <img id="prod-lb-img" class="product-lightbox-image" src="" alt="" />
</div>

<div id="footer-placeholder"></div>

<script src="js/footer.js"></script>
<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
      if (typeof initFooter === 'function') initFooter();
    });
</script>

<script src="js/products.js"></script>

</body>
</html>
