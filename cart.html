<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WODI Furniture | السلة</title>
  <link rel="icon" type="image/png" href="images/logos/favicon-v1.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variable.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet" href="css/shopping.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/nav.css">
</head>
<body>

<div id="nav-placeholder"></div>

<script src="js/nav.js"></script>
<script type="module" src="js/auth.js"></script>
<script src="https://www.google.com/recaptcha/enterprise.js?render=6Lde4nktAAAAAAPAlUeMAGT4Ki99VV9yNW56TuVw"></script>

<script>
fetch('nav.html')
    .then(res => res.text())
    .then(html => {
        document.getElementById('nav-placeholder').innerHTML = html;
        if (typeof initNavbar === 'function') {
            initNavbar();
        }

        const waitForLogoutSystem = (retries = 20) => {
            if (typeof window.initLogoutSystem === 'function') {
                window.initLogoutSystem();
            } else if (retries > 0) {
                setTimeout(() => waitForLogoutSystem(retries - 1), 50);
            } else {
                console.warn('فشل تحميل نظام تسجيل الخروج بعد عدة محاولات.');
            }
        };
        waitForLogoutSystem();
    });
</script>

<main class="conf-page">
  <div class="conf config-layout">
    <section class="main-column full-width-column">

      <!-- Search Section -->
      <div class="search-section-wrapper">
        <div class="search-container">
          <div class="search-box" id="main-search-box">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="product-search-input" placeholder="ابحث عما ترغب فيه..." onfocus="openSearchDropdown()" oninput="handleAdvancedSearch(this.value)">
          </div>

          <div class="search-dropdown" id="search-dropdown">
            <div class="search-results-container">
              <div class="search-suggestions-list" id="search-suggestions-list"></div>
              <div class="search-products-grid" id="search-products-grid"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="search-backdrop" id="search-backdrop" onclick="closeSearchDropdown()"></div>

      <!-- Not Logged In State -->
      <div id="shopping-not-logged-in" class="shopping-not-logged-in">
        <header class="shopping-header-not-logged">
          <h1 class="shopping-title-not-logged">سلة المشتريات</h1>
          <p class="shopping-description-not-logged">احفظ المنتجات التي تعجبك بالنقر على أيقونة القلب، وعد إليها في أي وقت.</p>
        </header>

        <div class="shopping-login-container">
          <button class="btn-google-login" id="btn-google-login-shopping">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            قم بتسجيل الدخول باستخدام جوجل
          </button>
        </div>
      </div>

      <!-- Logged In State -->
      <div id="shopping-logged-in" class="shopping-logged-in hidden">
        <header class="shopping-header-logged">
          <h2 class="shopping-title-logged">سلة المشتريات</h2>
          <div class="shopping-counter-container">
            <span class="shopping-count-label">عدد المنتجات:</span>
            <span class="shopping-count-number" id="shopping-count">0</span>
          </div>
        </header>

        <!-- Cart Summary (Totals + Actions) -->
        <div id="cart-summary" class="cart-summary" style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 0 12px 16px;">
          <div class="cart-summary-left" style="text-align:right;">
            <div style="font-weight:700;">العناصر: <span id="cart-items-count">0</span></div>
            <div style="margin-top:6px;">الإجمالي: <span id="cart-grand-total">0</span> EGP</div>
          </div>
          <div class="cart-summary-actions" style="display:flex; gap:8px; align-items:center;">
            <button id="btn-clear-cart" class="related-see-more-btn" style="border-color:var(--color-error); color:var(--color-error);">تفريغ السلة</button>
            <button id="btn-generate-summary" class="related-see-more-btn" style="background:var(--color-primary); color:#fff;">ملخص الطلب</button>
          </div>
        </div>

        <!-- Empty State -->
        <div id="shopping-empty-state" class="shopping-empty-state">
          <img src="images/ui/empty-cart.svg" alt="لا توجد منتجات في السلة" class="empty-shopping-image">
          <h3 class="empty-cart-title">لا توجد منتجات السلة بعد</h3>
          <p class="empty-cart-text">ابدأ بإضافة المنتجات التي تعجبك إلى قائمة سلة المشتريات</p>
        </div>

        <!-- Cart Products Grid -->
        <div id="cart-products-grid" class="cart-products-grid">
          <!-- Products will be rendered here -->
        </div>
      </div>

    <!-- Related Products Section -->
    <div id="related-products-section" class="related-products-section">

        <h2 class="related-products-title">قد يعجبك أيضاً</h2>

        <div class="ikea-products-wrapper" data-group="related-scroll">

        <div class="prod-grid scroll-x-styled" 
            id="related-products-carousel" 
            role="list" 
            aria-label="المنتجات ذات الصلة">
            <!-- Related products will be rendered here -->
        </div>

        </div>

    </div>

    </div>

    </section>
  </div>
</main>

<!-- Lightbox -->
<div class="lb product-lightbox-overlay" id="prod-lb" onclick="closeLB()">
  <button class="lb-close product-lightbox-close" onclick="closeLB()">×</button>
  <img id="prod-lb-img" class="product-lightbox-image" src="" alt="" />
</div>

<!-- Order Preview Modal -->
<div id="order-preview-modal" class="order-preview-modal" aria-hidden="true" style="display:none; position:fixed; inset:0; z-index:12000; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
  <div class="order-preview-inner" role="document" style="background:var(--color-bg-white); width:90%; max-width:900px; border-radius:var(--radius-md,8px); overflow:auto; max-height:90%; padding:18px; box-sizing:border-box;">
    <div class="order-preview-toolbar" style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px;">
      <div style="font-weight:800; font-size:16px;">معاينة ملخص الطلب</div>
      <div style="display:flex; gap:8px;">
        <button id="btn-download-pdf" class="related-see-more-btn" style="background:var(--color-primary); color:#fff;">تحميل PDF</button>
        <button id="btn-send-whatsapp" class="related-see-more-btn" style="border-color:var(--color-primary); color:var(--color-primary);">إرسال عبر WhatsApp</button>
        <button id="btn-close-preview" class="related-see-more-btn" style="border-color:var(--color-text-main); color:var(--color-text-main);">إغلاق</button>
      </div>
    </div>

    <div id="order-invoice-preview" style="direction:rtl; text-align:right;">
      <!-- Invoice HTML will be injected here by cart.js -->
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/footer.js"></script>
<script>
  fetch('footer.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
      if (typeof initFooter === 'function') initFooter();
    });
</script>

<!-- html2pdf (used to convert the invoice HTML into PDF in-browser) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>

<script type="module" src="js/cart.js"></script>

</body>
</html>
